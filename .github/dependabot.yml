version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-nuget)"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-npm)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-actions)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-docker)"
